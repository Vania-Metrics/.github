# Called at the end of the CI of the core and of every collector, on main: records the run, the
# repository's manifest and what its sources declare in the data branch of
# Vania-Metrics/vania-metrics.github.io, which rebuilds https://vania-metrics.github.io from it.
# Nothing here runs on its own.
#
#   status:
#     needs: ci
#     if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
#     permissions: { contents: read, actions: read }
#     uses: Vania-Metrics/.github/.github/workflows/status.yml@main
#     with: { result: "${{ needs.ci.result }}" }
#     secrets: { STATUS_DEPLOY_KEY: "${{ secrets.VANIA_STATUS_DEPLOY_KEY }}" }
name: status

on:
  workflow_call:
    inputs:
      result:
        description: 'Result of the job that ran the tests: needs.<job>.result'
        type: string
        required: true
    secrets:
      STATUS_DEPLOY_KEY:
        description: 'Deploy key of Vania-Metrics/vania-metrics.github.io, with write access'
        required: true

permissions:
  contents: read
  # The outcome of each cell is read from the logs of the run's other jobs.
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The calling repository at the commit that was tested: its manifest and its sources.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Vania-Metrics/.github
          ref: main
          path: tools
          sparse-checkout: .github/status
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Vania-Metrics/vania-metrics.github.io
          ref: data
          path: site-data
          ssh-key: ${{ secrets.STATUS_DEPLOY_KEY }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ inputs.result }}
        run: |
          repo=${GITHUB_REPOSITORY#*/}
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet --break-system-packages pyyaml==6.0.3
          extra=()
          if [ -f repo/collector-test.yml ]; then extra=(--collector-test repo/collector-test.yml); fi
          python3 tools/.github/status/collect.py --repo "$repo" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --result "$RESULT" "${extra[@]}" > run.json
          python3 tools/.github/status/extract.py repo > catalog.json
          git -C site-data config user.name 'github-actions[bot]'
          git -C site-data config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Every repository publishes here at the end of its CI, sometimes at the same moment:
          # start again from the branch as it is now until the push goes through.
          for attempt in 1 2 3 4 5 6 7 8; do
            git -C site-data fetch --quiet --depth 1 origin data
            git -C site-data reset --quiet --hard FETCH_HEAD
            python3 tools/.github/status/store.py site-data --record run.json \
              --manifest repo/compatibility.yml --catalog catalog.json
            git -C site-data add --all
            if git -C site-data diff --cached --quiet; then exit 0; fi
            git -C site-data commit --quiet --message "$repo: $GITHUB_WORKFLOW $RESULT at ${GITHUB_SHA::7}"
            if git -C site-data push --quiet origin HEAD:data; then exit 0; fi
            sleep $((5 + RANDOM % 20))
          done
          echo "::error::could not push to the data branch"
          exit 1
