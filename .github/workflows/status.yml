# Called at the end of the CI of the core and of every collector, on main: records the run in the
# status branch of this repository and rebuilds the page there (README.md), the compatibility and
# CI status of every repository. Nothing here runs on its own.
#
#   status:
#     needs: ci
#     if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
#     permissions: { contents: read, actions: read }
#     uses: Vania-Metrics/.github/.github/workflows/status.yml@main
#     with: { result: "${{ needs.ci.result }}" }
#     secrets: { STATUS_DEPLOY_KEY: "${{ secrets.VANIA_STATUS_DEPLOY_KEY }}" }
name: status

on:
  workflow_call:
    inputs:
      result:
        description: 'Result of the job that ran the tests: needs.<job>.result'
        type: string
        required: true
    secrets:
      STATUS_DEPLOY_KEY:
        description: 'Deploy key of Vania-Metrics/.github, with write access'
        required: true

permissions:
  contents: read
  # The outcome of each cell is read from the logs of the run's other jobs.
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The calling repository's manifest, at the commit that was tested.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          sparse-checkout: |
            compatibility.yml
            collector-test.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Vania-Metrics/.github
          ref: main
          path: tools
          sparse-checkout: .github/status
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Vania-Metrics/.github
          ref: status
          path: page
          ssh-key: ${{ secrets.STATUS_DEPLOY_KEY }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ inputs.result }}
        run: |
          repo=${GITHUB_REPOSITORY#*/}
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet --break-system-packages pyyaml==6.0.3
          extra=()
          if [ -f repo/collector-test.yml ]; then extra=(--collector-test repo/collector-test.yml); fi
          python3 tools/.github/status/collect.py --repo "$repo" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --result "$RESULT" "${extra[@]}" > run.json
          git -C page config user.name 'github-actions[bot]'
          git -C page config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Every repository publishes here at the end of its CI, sometimes at the same moment:
          # start again from the branch as it is now until the push goes through.
          for attempt in 1 2 3 4 5 6 7 8; do
            git -C page fetch --quiet --depth 1 origin status
            git -C page reset --quiet --hard FETCH_HEAD
            python3 tools/.github/status/render.py page --record run.json --manifest repo/compatibility.yml
            git -C page add --all
            if git -C page diff --cached --quiet; then exit 0; fi
            git -C page commit --quiet --message "$repo: $GITHUB_WORKFLOW $RESULT at ${GITHUB_SHA::7}"
            if git -C page push --quiet origin HEAD:status; then exit 0; fi
            sleep $((5 + RANDOM % 20))
          done
          echo "::error::could not push to the status branch"
          exit 1
