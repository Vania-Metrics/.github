name: Bug report
description: Something is wrong or missing in the metrics.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: VaniaMetrics version
      description: Core and collector jar versions.
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server software
      placeholder: Paper 1.21.11 build 123 / Velocity 3.5.1
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Metrics output or logs
      description: The relevant lines from /metrics or the server log.
      render: text
